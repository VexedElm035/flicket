services:
  db:
    image: mariadb:10.11
    container_name: flicket-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: flicket
      MYSQL_USER: flicket
      MYSQL_PASSWORD: flicket_password
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -proot_password --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - flicket-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flicket-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-5050}:5000"
    environment:
      - DB_TYPE=3
      - DB_DRIVER=pymysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=flicket
      - DB_USER=flicket
      - DB_PASSWORD=flicket_password
      - FLASK_ADMIN_USERNAME=admin
      - FLASK_ADMIN_PASSWORD=admin
      - FLASK_ADMIN_EMAIL=admin@example.com
      - FLASK_BASE_URL=http://localhost:${PORT:-5050}
      - SECRET_KEY=flicket-secret-key-please-change-in-production
      - NOTIFICATION_USER_PASSWORD=notification-secret-password-change-me
    volumes:
      - flicket_uploads:/app/application/flicket/static/flicket_uploads
      - flicket_avatars:/app/application/flicket/static/flicket_avatars
    networks:
      - flicket-network

volumes:
  mariadb_data:
  flicket_uploads:
  flicket_avatars:

networks:
  flicket-network:
    driver: bridge
